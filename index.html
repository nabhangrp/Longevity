<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Longevity — منصة ذكاء اصطناعي لإطالة العمر الصحي، مبنية في الإمارات للعالم. افهم فحوصاتك، مدرب شخصي افتراضي، برنامج انقطاع الطمث، ودليل عيادات معتمدة.">
<meta property="og:title" content="Longevity">
<meta property="og:description" content="افهم فحوصاتك، وعِش أطول وأنت بصحتك. Understand your lab results. Live longer, in good health.">
<meta property="og:type" content="website">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Longevity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: one calm column, sand-and-sea palette; bilingual AR/EN with RTL/LTR switch; three views routed by hash (home / report / providers). */
:root{
  --bg:#F7F6F1; --bg-2:#EEEBE2; --card:#FFFFFF;
  --fg:#15302D; --fg-2:#4E635F; --line:#D9D4C7;
  --accent:#176B5C; --accent-2:#0F4F44; --accent-soft:#E3EFEB;
  --gold:#B88A3C; --gold-soft:#F3E9D3;
  --ok:#2E7D57; --ok-soft:#E3F1E8; --warn:#B9731A; --warn-soft:#FBEBD2; --bad:#B5443A; --bad-soft:#F8E1DE;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,-apple-system,Segoe UI,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1D1B;--bg-2:#132725;--card:#17302D;--fg:#EDEAE1;--fg-2:#A9B5B1;--line:#2A423E;
  --accent:#4FB399;--accent-2:#7ACDB7;--accent-soft:#1B3A35;--gold:#D9B06A;--gold-soft:#2C2A1E;
  --ok:#6BC79A;--ok-soft:#1C3A2C;--warn:#E0A24E;--warn-soft:#3A2E17;--bad:#E07A70;--bad-soft:#3E201D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D1B;--bg-2:#132725;--card:#17302D;--fg:#EDEAE1;--fg-2:#A9B5B1;--line:#2A423E;
  --accent:#4FB399;--accent-2:#7ACDB7;--accent-soft:#1B3A35;--gold:#D9B06A;--gold-soft:#2C2A1E;
  --ok:#6BC79A;--ok-soft:#1C3A2C;--warn:#E0A24E;--warn-soft:#3A2E17;--bad:#E07A70;--bad-soft:#3E201D;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.7;margin:0}
h1,h2,h3,h4{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0;font-weight:600}
h1{font-size:clamp(2rem,5.5vw,3.4rem);font-weight:700}
h2{font-size:clamp(1.5rem,3.4vw,2.2rem)}
h3{font-size:1.15rem}
h4{font-size:1rem}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:72px;scroll-margin-top:84px}
section.tight{padding-block:40px}
.band{background:var(--bg-2)}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;font-family:var(--display)}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:.9rem}
.lead{color:var(--fg-2);font-size:1.12rem;max-width:62ch}
.stack{display:grid;gap:18px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid>*{min-width:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;font-family:var(--display);text-decoration:none;border:1.5px solid var(--accent);cursor:pointer;font-size:1rem;transition:transform .15s;background:transparent;color:var(--accent)}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff}
.btn.small{padding:8px 16px;font-size:.92rem}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.note{font-size:.88rem;color:var(--fg-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--bg-2);color:var(--fg-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:10px}
.logo .mark{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--accent) 0 72%,var(--gold) 72% 100%);position:relative}
.logo .mark::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.navlinks{display:flex;gap:6px;align-items:center;font-size:.95rem;flex-wrap:wrap;justify-content:flex-end}
.navlinks a{color:var(--fg-2);text-decoration:none;padding:6px 10px;border-radius:999px}
.navlinks a:hover{color:var(--fg)}
.navlinks a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
@media (max-width:760px){.navlinks .hide-m{display:none}}
.lang{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:600;cursor:pointer}
.demo-bar{background:var(--gold-soft);color:var(--fg);font-size:.85rem;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line)}

/* hero */
.hero{padding-block:72px 56px;position:relative;overflow:hidden}
.hero .wrap{display:grid;gap:36px;grid-template-columns:1.2fr .8fr;align-items:center}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}}
.hero-art{aspect-ratio:1/1;max-width:100%;width:100%;max-height:380px}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--gold-soft);color:var(--fg);font-size:.88rem;border:1px solid var(--line)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:grid;gap:10px;align-content:start;min-width:0}
.card p{color:var(--fg-2);font-size:.98rem}
.card.link{text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.card.link:hover{transform:translateY(-2px);border-color:var(--accent)}
.card.link h3{color:var(--accent)}
.steps{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.step{padding:22px;border-top:3px solid var(--line);display:grid;gap:8px}
.step.active{border-top-color:var(--accent)}
.step .k{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}

/* stats strip */
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;display:grid;gap:4px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.stat .l{font-size:.92rem;color:var(--fg-2)}
.stat .s{font-size:.78rem;color:var(--fg-2);opacity:.8}

/* roadmap */
.roadmap{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));position:relative}
.rm{padding:18px 16px 0;border-top:3px solid var(--accent);display:grid;gap:6px;min-width:0}
.rm.future{border-top-color:var(--line)}
.rm .m{font-family:var(--display);font-weight:700;color:var(--accent);font-size:.85rem;font-variant-numeric:tabular-nums}
.rm.future .m{color:var(--fg-2)}

/* plans */
.plans{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.plan{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;display:grid;gap:12px;align-content:start;min-width:0}
.plan.featured{border-color:var(--accent);box-shadow:0 10px 30px -18px var(--accent)}
.price{font-family:var(--display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-size:.95rem;color:var(--fg-2);font-weight:400}
.plan ul{margin:0;padding-inline-start:20px;color:var(--fg-2);font-size:.96rem;display:grid;gap:6px}

/* two-col */
.split{display:grid;gap:28px;grid-template-columns:1fr 1fr;align-items:start}
.split.three{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.split>*{min-width:0}
.list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:flex-start}
.list li::before{content:"";flex:0 0 10px;height:10px;margin-top:11px;border-radius:50%;background:var(--gold)}

/* founder */
.founder{display:grid;gap:28px;grid-template-columns:140px 1fr;align-items:center}
@media (max-width:600px){.founder{grid-template-columns:1fr}}
.avatar{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold) 0,var(--accent) 60%,var(--accent-2) 100%);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:2.2rem}

/* form */
form{display:grid;gap:14px}
.row{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media (max-width:600px){.row{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-size:.92rem;color:var(--fg-2)}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:1rem}
.status{padding:12px 14px;border-radius:10px;background:var(--gold-soft);border:1px solid var(--line);font-size:.95rem}
.status.ok{border-color:var(--ok)}
.copyline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
code.sel{user-select:all;background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:8px;font-family:var(--body)}

/* owner panel */
.owner{border:1.5px dashed var(--gold);border-radius:var(--radius);padding:20px;display:grid;gap:12px}
.owner table{width:100%;border-collapse:collapse;font-size:.92rem}
.owner th,.owner td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line)}
.tablewrap{overflow-x:auto}

/* ---------- report view ---------- */
.rep-head{display:grid;gap:20px;grid-template-columns:1fr auto;align-items:end}
@media (max-width:700px){.rep-head{grid-template-columns:1fr}}
.profile{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.profile .av{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2rem}
.profile .meta{font-size:.9rem;color:var(--fg-2)}
.rep-grid{display:grid;gap:20px;grid-template-columns:320px 1fr;align-items:start}
@media (max-width:860px){.rep-grid{grid-template-columns:1fr}}
.rep-grid>*{min-width:0}
.score{display:grid;gap:12px;justify-items:center;text-align:center}
.score svg{width:100%;max-width:240px;height:auto}
.score .big{font-family:var(--display);font-weight:700;font-size:1.05rem}
.kv{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.kv .stat{padding:14px 16px}
.kv .stat .v{font-size:1.5rem}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:12px;fill:var(--fg-2)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.08}
.chart .dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .lbl{fill:var(--fg);font-weight:600;font-family:var(--display)}
.markers{width:100%;border-collapse:collapse;font-size:.94rem}
.markers th{text-align:start;font-size:.8rem;color:var(--fg-2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.markers td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.markers td.n{font-weight:600;white-space:nowrap}
.markers td.v{font-variant-numeric:tabular-nums;white-space:nowrap}
.markers td.x{color:var(--fg-2);font-size:.9rem;min-width:220px}
.markers tr:last-child td{border-bottom:none}
.doc-banner{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--radius);background:var(--warn-soft);border:1px solid var(--warn)}
.doc-banner .ic{flex:0 0 36px;height:36px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.cuisine{display:flex;gap:8px;flex-wrap:wrap}
.cuisine button{border:1.5px solid var(--line);background:var(--card);color:var(--fg-2);border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:600;cursor:pointer;font-size:.9rem}
.cuisine button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.meals{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.meal{background:var(--bg-2);border-radius:12px;padding:14px 16px;display:grid;gap:4px;min-width:0}
.meal .t{font-size:.8rem;color:var(--gold);font-weight:600;font-family:var(--display)}
.meal .d{font-size:.95rem}
.meal .w{font-size:.82rem;color:var(--fg-2)}
.week{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.week .card{padding:16px 18px;gap:6px}
.week .card h4{color:var(--accent)}
.week .card p{font-size:.92rem}
.next{display:grid;gap:10px}
.next div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.next div:last-child{border-bottom:none}
.next span:last-child{color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- providers view ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{width:auto;min-width:160px;padding:10px 12px}
.filters input{flex:1 1 200px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:transparent;color:var(--fg-2);padding:9px 16px;font-family:var(--display);font-weight:600;cursor:pointer;font-size:.9rem}
.seg button.on{background:var(--accent);color:#fff}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.prov{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:grid;gap:8px;align-content:start;min-width:0}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard h3{font-size:1.02rem}
.pcard .loc{font-size:.88rem;color:var(--fg-2)}
.pcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.count{font-size:.9rem;color:var(--fg-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--fg-2)}

/* chat */
.chat-fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:calc(20px + env(safe-area-inset-right,0px));z-index:30;border:none;background:var(--accent);color:#fff;border-radius:999px;padding:14px 20px;font-family:var(--display);font-weight:600;box-shadow:0 12px 30px -10px var(--accent-2);cursor:pointer;font-size:1rem}
[dir="rtl"] .chat-fab{inset-inline-end:calc(20px + env(safe-area-inset-left,0px))}
.chat{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));inset-inline-end:calc(20px + env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));max-height:min(560px,70vh);z-index:31;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);display:grid;grid-template-rows:auto 1fr auto auto;overflow:hidden}
[dir="rtl"] .chat{inset-inline-end:calc(20px + env(safe-area-inset-left,0px))}
.chat-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:600}
.chat-h button{background:none;border:none;color:var(--fg-2);font-size:1.3rem;cursor:pointer}
.chat-log{overflow-y:auto;padding:14px;display:grid;gap:10px;align-content:start;min-height:160px}
.msg{padding:10px 14px;border-radius:14px;max-width:88%;font-size:.95rem;white-space:pre-wrap}
.msg.u{background:var(--accent);color:#fff;justify-self:end}
.msg.a{background:var(--bg-2);justify-self:start}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-in input{flex:1;min-width:0}
.chat-in button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-weight:600;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--fg-2);border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer;font-family:inherit}

/* ---------- InBody ---------- */
.inbody{display:grid;gap:20px;grid-template-columns:1fr 1fr}
@media (max-width:860px){.inbody{grid-template-columns:1fr}}
.inbody>*{min-width:0}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;display:grid;gap:6px;justify-items:center;background:var(--bg-2);cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.drop .ic{width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--accent);display:grid;place-items:center;font-size:1.4rem;font-weight:700;font-family:var(--display);border:1px solid var(--line)}
.comp{display:grid;gap:12px}
.comp .r{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:.94rem}
.comp .r .x{grid-column:1/-1;font-size:.84rem;color:var(--fg-2)}
.comp .bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--bg-2);position:relative;overflow:hidden}
.comp .bar i{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.comp .bar i.warn{background:var(--warn)}
.comp .bar i.bad{background:var(--bad)}
.comp .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.segbody{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:.78rem;color:var(--fg-2)}
.segbody div{background:var(--bg-2);border-radius:10px;padding:8px 4px}
.segbody b{display:block;font-size:1rem;color:var(--fg);font-variant-numeric:tabular-nums;font-family:var(--display)}
.segbody b.low{color:var(--warn)}
/* ---------- trainer ---------- */
.tr-controls{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tr-controls .seg{display:flex;width:100%}
.tr-controls .seg button{flex:1;padding:9px 6px;font-size:.86rem}
.days{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0;display:grid;align-content:start}
.day .dh{padding:12px 18px;background:var(--accent-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.day .dh h3{color:var(--accent);font-size:1rem}
.day .dh span{font-size:.82rem;color:var(--fg-2)}
.ex{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.ex .pic{width:68px;height:68px;border-radius:12px;background:var(--bg-2);color:var(--fg);display:grid;place-items:center}
.ex .pic svg{width:60px;height:60px}
.ex .nm{font-weight:600;font-size:.95rem}
.ex .sr{font-size:.86rem;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.ex .cue{font-size:.8rem;color:var(--fg-2)}
.day .ft{padding:10px 18px;border-top:1px solid var(--line);font-size:.82rem;color:var(--fg-2);background:var(--bg-2)}
.phases{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.phase{padding:18px 16px 0;border-top:3px solid var(--accent);display:grid;gap:6px;min-width:0}
.phase .w{font-family:var(--display);font-weight:700;color:var(--accent);font-size:.85rem}
.exlib{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.exlib .it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;justify-items:center;text-align:center;font-size:.85rem;min-width:0}
.exlib .it svg{width:76px;height:76px;color:var(--fg)}
.exlib .it .m{font-size:.75rem;color:var(--fg-2)}
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.rules .card{padding:16px 18px;gap:6px}
.rules .card h4{color:var(--accent)}
.rules .card p{font-size:.9rem}
/* ---------- women ---------- */
.sym{display:flex;gap:8px;flex-wrap:wrap}
.sym span{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.9rem}
.snap{display:grid;gap:20px;grid-template-columns:1fr 1fr;align-items:start}
@media (max-width:860px){.snap{grid-template-columns:1fr}}
.snap>*{min-width:0}
.mini{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.mini .stat{padding:12px 14px}
.mini .stat .v{font-size:1.35rem}
.mini .stat .v small{font-size:.8rem;color:var(--fg-2);font-weight:400}
footer{padding-block:40px;border-top:1px solid var(--line);color:var(--fg-2);font-size:.9rem}
footer .wrap{display:grid;gap:12px}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
footer nav a{text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

const GOALS = {
 fat:{sets:3,reps:"12–15",rest:"45–60",rpe:"7/10"},
 muscle:{sets:4,reps:"8–10",rest:"90",rpe:"8/10"},
 health:{sets:3,reps:"10–12",rest:"60",rpe:"7/10"},
 senior:{sets:2,reps:"10–12",rest:"90",rpe:"5–6/10"},
 meno:{sets:3,reps:"8–12",rest:"60–90",rpe:"7/10"}
};
let tgoal="fat", tdays=3, tplace="gym";
function buildProgram(goal,days,place){
  const gym=place==="gym", sen=goal==="senior";
  const push = sen?"wallpush":(gym?"bench":"pushup");
  const pull = sen?"bandrow":"row";
  const vpull = gym?"pulldown":"bandpull";
  const sq = sen?"chair":"squat";
  const hg = sen?"bridge":"hinge";
  const lg = sen?"stepup":"lunge";
  const A=[sq,push,pull,hg,"plank"], B=[hg,vpull,"ohp",lg,"bridge"];
  const U=[push,pull,"ohp",vpull,"curl"], L=[sq,hg,lg,"bridge","plank"];
  if(days===2) return [["d_full",A,0],["d_full",B,3]];
  if(days===3) return [["d_full",A,0],["d_full",B,2],["d_full",A,4]];
  return [["d_upper",U,0],["d_lower",L,1],["d_upper",U,3],["d_lower",L,4]];
}
function renderTrainer(){
  const t=T[lang]; const g=GOALS[tgoal];
  if(tgoal==="senior"&&tdays===4) tdays=3;
  document.querySelector('#daysSeg button[data-v="4"]').disabled = (tgoal==="senior");
  [["goalSeg",tgoal],["daysSeg",String(tdays)],["placeSeg",tplace]].forEach(([id,v])=>document.querySelectorAll("#"+id+" button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)));
  const box=document.getElementById("days"); box.innerHTML="";
  buildProgram(tgoal,tdays,tplace).forEach(([kind,list,dn],i)=>{
    const d=document.createElement("div"); d.className="day";
    const dh=document.createElement("div"); dh.className="dh";
    const h=document.createElement("h3"); h.textContent=t.day+" "+(i+1)+" · "+t[kind];
    const sp=document.createElement("span"); sp.textContent=t.dn[dn]; dh.append(h,sp); d.appendChild(dh);
    const wu=document.createElement("div"); wu.className="ft"; wu.textContent=t.wu; d.appendChild(wu);
    list.forEach(k=>{
      const e=EX[k]; const row=document.createElement("div"); row.className="ex";
      const pic=document.createElement("div"); pic.className="pic"; pic.innerHTML=e.s;
      const txt=document.createElement("div");
      const nm=document.createElement("div"); nm.className="nm"; nm.textContent=e[lang];
      const sr=document.createElement("div"); sr.className="sr";
      const timed=(k==="plank");
      sr.textContent = timed ? (g.sets+" × 30–45 "+t.x_sec+" · "+t.x_rest+" "+g.rest+" "+t.x_sec)
                             : (g.sets+" "+t.x_sets+" × "+g.reps+" "+t.x_reps+" · "+t.x_rest+" "+g.rest+" "+t.x_sec+" · "+t.x_rpe+" "+g.rpe);
      const cue=document.createElement("div"); cue.className="cue"; cue.textContent=e.m[lang]+" — "+e.c[lang];
      txt.append(nm,sr,cue); row.append(pic,txt); d.appendChild(row);
    });
    const ft=document.createElement("div"); ft.className="ft"; ft.textContent = tgoal==="fat"?t.fin_fat:(tgoal==="senior"?t.fin_senior:(tgoal==="meno"?t.fin_meno:t.fin_def)); d.appendChild(ft);
    box.appendChild(d);
  });
}

const VIEWS=["home","report","providers","trainer","women"];
function route(){
  const h=(location.hash||"").replace("#","");
  const v=VIEWS.includes(h)?h:"home";
  VIEWS.forEach(x=>{ document.getElementById("view-"+x).hidden=(x!==v); });
  document.querySelectorAll("[data-view]").forEach(a=>a.classList.toggle("on",a.dataset.view===v));
  if(v==="home" && h && h!=="home"){ const el=document.getElementById(h); if(el){ el.scrollIntoView({block:"start"}); return; } }
  window.scrollTo(0,0);
}
addEventListener("hashchange",route); route();

let db=null, user=null;
const statusEl=document.getElementById("status");
function showStatus(msg, ok, withEmail){
  statusEl.hidden=false; statusEl.className="status"+(ok?" ok":"");
  statusEl.innerHTML=""; statusEl.append(msg+" ");
  if(withEmail){
    const c=document.createElement("code"); c.className="sel"; c.textContent=CONTACT_EMAIL;
    const b=document.createElement("button"); b.type="button"; b.className="btn small"; b.textContent=T[lang].copy;
    b.onclick=()=>{ navigator.clipboard?.writeText(CONTACT_EMAIL).then(()=>{b.textContent=T[lang].copied;}).catch(()=>{ const r=document.createRange(); r.selectNodeContents(c); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }); };
    const w=document.createElement("span"); w.className="copyline"; w.append(c,b); statusEl.append(w);
  }
}
document.getElementById("wl").addEventListener("submit", async e=>{
  e.preventDefault();
  const t=T[lang]; const g=id=>document.getElementById(id).value.trim();
  const f={ name:g("name"), email:g("email"), phone:g("phone"), type:g("type"), city:g("city"), lang, ts:new Date().toISOString() };
  const submitBtn=document.getElementById("submitBtn");
  if(!f.name || (!f.email && !f.phone)){ showStatus(t.st_need,false,false); return; }
  showStatus(t.st_saving,false,false); submitBtn.disabled=true;
  try{
    if(db && user){ const id=await user.id(); await db.doc("waitlist/"+id).set(f); }
    else if(FORM_ENDPOINT){ const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(f)}); if(!r.ok) throw new Error("form"); }
    else { submitBtn.disabled=false; showStatus(t.st_nodb,false,true); return; }
    showStatus(t.st_ok,true,false); try{ localStorage.setItem("lv_joined","1"); }catch(_){}
  }catch(err){ showStatus(t.st_err,false,true); }
  submitBtn.disabled=false;
});

function faqAnswer(q){
  const s=q.toLowerCase(); let best=null, score=0;
  FAQ.forEach(f=>{ const n=f.k.filter(k=>s.includes(k.toLowerCase())).length; if(n>score){score=n;best=f;} });
  return best ? best[lang] : T[lang].chat_unknown+" "+CONTACT_EMAIL;
}
let sampleFn=null, hist=[];
const log=document.getElementById("chatLog");
function addMsg(txt, who){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
document.getElementById("chatFab").onclick=async()=>{
  const c=document.getElementById("chat"); c.hidden=!c.hidden;
  if(!c.hidden && !log.childElementCount){
    addMsg(T[lang].chat_hi,"a");
    if(sampleFn===null){ try{ sampleFn = CLAUDE_RT ? await CLAUDE_RT.use("sample") : false; }catch(e){ sampleFn=false; } }
    if(!sampleFn) addMsg(T[lang].chat_faq,"a");
  }
};
document.getElementById("chatClose").onclick=()=>{ document.getElementById("chat").hidden=true; };
async function send(){
  const inp=document.getElementById("chatIn"); const q=inp.value.trim(); if(!q) return;
  inp.value=""; addMsg(q,"u");
  if(!sampleFn){ addMsg(faqAnswer(q),"a"); return; }
  hist.push({role:"user",content:q});
  const msgs=[{role:"user",content:KB+"\n\n(Conversation follows.)"},{role:"assistant",content:"Understood."},...hist.slice(-8)];
  const bubble=addMsg("…","a");
  try{
    const r = await sampleFn(msgs,{cache:false, modelTier:"quick", onText:({text})=>{ bubble.textContent=text||"…"; log.scrollTop=log.scrollHeight; }});
    bubble.textContent=r.text; hist.push({role:"assistant",content:r.text});
  }catch(err){ bubble.textContent = (err && err.text) || T[lang].chat_na+" "+CONTACT_EMAIL; }
}
document.getElementById("chatSend").onclick=send;
document.getElementById("chatIn").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });
